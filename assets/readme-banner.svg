<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">nix-pkgs</title>
  <desc id="desc">A neon package constellation over a deep blue and violet background.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#07162f"/>
      <stop offset="0.55" stop-color="#17245e"/>
      <stop offset="1" stop-color="#32145d"/>
