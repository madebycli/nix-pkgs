name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - name: Verify lock file
        run: |
          set -euo pipefail
          nix flake lock
          git diff --exit-code -- flake.lock
      - name: Validate outputs
        run: |
          set -euo pipefail
          nix flake show --no-write-lock-file
          nix flake check --no-write-lock-file --print-build-logs
      - name: Build catalog packages
        run: |
          set -euo pipefail
          nix build .#twintaillauncher --no-write-lock-file --print-build-logs
          nix build .#helium --no-write-lock-file --print-build-logs
          nix build .#sakura --no-write-lock-file --print-build-logs
          nix build .#pipes --no-write-lock-file --print-build-logs
          nix build .#gif-player --no-write-lock-file --print-build-logs
