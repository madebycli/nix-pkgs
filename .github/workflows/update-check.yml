name: Manual update check

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-check
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: DeterminateSystems/determinate-nix-action@61cbfe2efc2d4e7a8a6d56967c3c1058e846c858 # v3.21.9
      - name: Check for lock changes
        id: update
        shell: bash
        run: |
          set -euo pipefail
          cp flake.lock "$RUNNER_TEMP/flake.lock.before"
          nix flake update
          if cmp -s "$RUNNER_TEMP/flake.lock.before" flake.lock; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "No input changes detected."
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git --no-pager diff -- flake.lock
          fi
      - name: Validate changed inputs
        if: steps.update.outputs.changed == 'true'
        run: |
          nix flake check --print-build-logs
          nix build .#twintaillauncher .#helium .#sakura .#pipes .#gif-player --print-build-logs
